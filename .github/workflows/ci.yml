name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: Quality gate (syntax, unit tests, suite validation, security)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Syntax check (node --check across all source files)
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Validate every suite against schema
        run: npm run qa:validate -- suites/*.json

      - name: Security gate (hardcoded secrets, insecure HTTP targets)
        run: for f in suites/*.json; do npm run qa:security -- "$f" || exit 1; done

  e2e:
    name: Extension boot test + smoke suite run
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Boot the real unpacked extension (Chromium)
        run: npm run test:extension

      # Each suite exercises a distinct action category (form fill/submit,
      # negative/validation, async wait, checkbox/select controls, API/JSON
      # contract, a11y audit, hover/reusable-flows, network mocking, perf/
      # security-header gates) against stable public targets - smoke.json
      # uses the IANA-reserved example.com; the rest use
      # the-internet.herokuapp.com (a QA-automation practice sandbox
      # maintained specifically for this purpose), jsonplaceholder.typicode.com,
      # and github.com (security-header reference only, HEAD request). These
      # are third-party services outside our control - an occasional CI
      # failure here is more likely their uptime than a real regression, but
      # that is the accepted tradeoff for exercising real scenario diversity
      # end-to-end.
      #
      # visual-regression.json is excluded on purpose: Playwright names
      # screenshot baselines per-OS (e.g. "...-win32.png"), so a baseline
      # generated on one OS is never found on another - it stays
      # schema-validated + security-gated above, but only meant to be
      # *executed* locally (or from a CI baseline generated by CI itself).
      - name: Run every suite through the CLI runner (except OS-specific visual baselines)
        run: |
          for f in suites/*.json; do
            if [ "$f" = "suites/visual-regression.json" ]; then
              echo "=== Skipping $f (OS-specific screenshot baseline, not portable to this runner) ==="
              continue
            fi
            echo "=== Running $f ==="
            npm run qa:run -- "$f" || exit 1
          done

      - name: Upload Playwright artifacts (reports, traces, screenshots, videos)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-flow-artifacts
          path: artifacts/
          retention-days: 14
